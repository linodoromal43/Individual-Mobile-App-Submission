<ion-content [fullscreen]="true" class="studify-auth">
  <div class="bg-mesh"></div>

  <main class="auth-shell">
    <div class="auth-card">
      <div class="brand">
        <div class="logo font-headline">Studify</div>
        <div class="tagline">Continue your journey into deep work.</div>
      </div>

      <h1 class="title font-headline">Welcome Back</h1>

      <form class="form" (ngSubmit)="onSubmit()">
        <div *ngIf="error" class="error">{{ error }}</div>

        <label class="field">
          <span class="label">Email</span>
          <span class="input">
            <span class="material-symbols-outlined icon">alternate_email</span>
            <input
              name="email"
              type="email"
              placeholder="-"
              autocomplete="email"
              required
              [(ngModel)]="email"
            />
          </span>
        </label>

        <label class="field">
          <span class="label-row">
            <span class="label">Password</span>
            <button type="button" class="link" (click)="error = 'Password reset is not wired yet.'">
              FORGOT?
            </button>
          </span>
          <span class="input">
            <span class="material-symbols-outlined icon">lock</span>
            <input
              name="password"
              type="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              [(ngModel)]="password"
            />
          </span>
        </label>

        <button class="primary" type="submit" [disabled]="loading">
          {{ loading ? 'Logging In…' : 'Log In' }}
        </button>
      </form>

      <div class="divider"><span>OR SIGN IN WITH</span></div>

      <div class="social">
        <button type="button" class="social-btn" (click)="error = 'Google sign-in is not wired yet.'">
          <span class="social-icon">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
          </span>
          Google
        </button>
        <button type="button" class="social-btn" (click)="error = 'Facebook sign-in is not wired yet.'">
          <span class="social-icon material-symbols-outlined">facebook</span>
          Facebook
        </button>
      </div>

      <p class="footer">
        Don't have an account?
        <a routerLink="/signup" class="footer-link">Sign Up</a>
      </p>
    </div>
  </main>
</ion-content>
